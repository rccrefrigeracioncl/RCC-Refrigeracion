<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R.C.C. Refrigeración</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7f9;color:#17324d}header{background:#006f86;color:#fff;padding:20px;text-align:center}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #0001}button{background:#007c91;color:white;border:0;border-radius:10px;padding:12px 16px;margin:5px;font-size:15px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #ccd6dc;border-radius:8px}.hidden{display:none}.tag{display:inline-block;background:#e2f2f5;padding:5px 9px;border-radius:8px;margin:3px}.item{border:1px solid #d9e1e5;border-radius:10px;padding:12px;margin:8px 0}
</style></head><body>
<header><h1>❄ R.C.C.</h1><div>Refrigeración y Climatización de Calidad</div></header>
<main id="app"></main>
<script>
const key='rcc_equipos_v1';
let data=JSON.parse(localStorage.getItem(key)||'[]');
if(!data.length)data=[{code:'RCC-001',client:'Restaurante El Nuevo Arriero',type:'Refrigerador',brand:'Ventus',model:'VRM-1300',ref:'R404A',history:[]}];
function save(){localStorage.setItem(key,JSON.stringify(data))}
function home(){app.innerHTML=`<div class=card><h2>Panel R.C.C.</h2><button onclick="list()">❄️ Equipos</button><button onclick="add()">➕ Agregar equipo</button><button onclick="scanInfo()">📷 Escanear QR</button><button onclick="upcoming()">📅 Próximas mantenciones</button></div><div class=card><b>Equipos registrados:</b> ${data.length}<br><small>Los datos se guardan en este dispositivo. Cada QR usa el código único de su equipo.</small></div>`}
function list(){app.innerHTML='<div class=card><h2>Equipos</h2>'+data.map((e,i)=>`<div class=item><b>${e.code}</b><br>${e.type} · ${e.brand} ${e.model}<br>${e.client}<br><button onclick="detail(${i})">📋 Ver ficha</button><button onclick="qr(${i})">📷 Ver QR de este equipo</button></div>`).join('')+'<button onclick="home()">← Inicio</button></div>'}
function add(){app.innerHTML=`<div class=card><h2>Nuevo equipo</h2>${['code','client','type','brand','model','ref'].map((x)=>`<label>${x}</label><input id="${x}" placeholder="${x}">`).join('')}<button onclick="create()">Guardar</button><button onclick="home()">Cancelar</button></div>`}
function create(){let e={code:code.value,client:client.value,type:type.value,brand:brand.value,model:model.value,ref:ref.value,history:[]};data.push(e);save();list()}
function detail(i){let e=data[i];app.innerHTML=`<div class=card><h2>${e.code}</h2><p><b>Cliente:</b> ${e.client}<br><b>Equipo:</b> ${e.type}<br><b>Marca:</b> ${e.brand}<br><b>Modelo:</b> ${e.model}<br><b>Refrigerante:</b> ${e.ref}</p><button onclick="service(${i})">🔧 Registrar servicio</button><button onclick="qr(${i})">▣ Ver QR</button><h3>Historial</h3>${e.history.length?e.history.map(h=>`<div class=item><b>${h.date} — ${h.kind}</b><br>${h.work}<br>Temp: ${h.temp} °C · Amp: ${h.amp} A<br>Baja: ${h.low} PSI · Alta: ${h.high} PSI</div>`).join(''):'Sin servicios registrados.'}<button onclick="list()">← Volver</button></div>`}
function service(i){app.innerHTML=`<div class=card><h2>Registrar servicio — ${data[i].code}</h2><label>Fecha</label><input id=date type=date><label>Tipo</label><select id=kind><option>Mantención preventiva</option><option>Reparación</option></select><label>Trabajo realizado</label><textarea id=work></textarea><label>Temperatura °C</label><input id=temp><label>Amperaje A</label><input id=amp><label>Presión baja PSI</label><input id=low><label>Presión alta PSI</label><input id=high><button onclick="addService(${i})">Guardar</button><button onclick="detail(${i})">Cancelar</button></div>`}
function addService(i){data[i].history.push({date:date.value,kind:kind.value,work:work.value,temp:temp.value,amp:amp.value,low:low.value,high:high.value});save();detail(i)}
function qr(i){let e=data[i];let base=location.href.split('?')[0].split('#')[0];let url=base+'?equipo='+encodeURIComponent(String(e.code));app.innerHTML=`<div class=card><h2>📷 QR — ${e.code}</h2><p>Este QR está asociado exclusivamente al equipo <b>${e.code}</b>.</p><div id=qrcode style="text-align:center;padding:15px"></div><p style="font-size:13px;word-break:break-all">${url}</p><button onclick="detail(${i})">← Volver</button></div>`;let make=()=>new QRCode(document.getElementById('qrcode'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});if(typeof QRCode!=='undefined'){make()}else{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=make;document.body.appendChild(s)}}
function scanInfo(){alert('Para probar un QR, usa la cámara o Google Lens sobre el código. El enlace abrirá automáticamente la ficha del código que contiene el QR.')}
function upcoming(){app.innerHTML='<div class=card><h2>Próximas mantenciones</h2><p>La programación de fechas y recordatorios se incorporará en la siguiente versión.</p><button onclick="home()">← Inicio</button></div>'}

/* Si se abre la página desde un QR, buscar el código y abrir SU ficha. */
function abrirEquipoDesdeQR(){
  const params=new URLSearchParams(location.search);
  let codigo=params.get('equipo');
  if(!codigo && location.hash && location.hash.length>1) codigo=decodeURIComponent(location.hash.substring(1));
  if(!codigo){ home(); return; }
  const i=data.findIndex(e=>String(e.code).trim().toLowerCase()===String(codigo).trim().toLowerCase());
  if(i>=0){
    detail(i);
  }else{
    app.innerHTML='<div class=card><h2>Equipo no encontrado</h2><p>El QR corresponde al código <b>'+codigo+'</b>, pero este equipo no está registrado en este dispositivo.</p><button onclick="home()">← Inicio</button></div>';
  }
}
abrirEquipoDesdeQR();
</script></body></html>
