<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R.C.C. Refrigeración y Climatización de Calidad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef5f8;font-family:Arial,sans-serif;color:#17324d}
.encabezado{background:#07879a;color:#fff;text-align:center;padding:24px 16px}
.encabezado h1{margin:0;font-size:30px}.encabezado p{margin:6px 0 0;font-size:17px}
main{max-width:720px;margin:28px auto;padding:0 14px}
.tarjeta{background:#fff;border-radius:18px;padding:26px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
h2{margin-top:0;font-size:28px}h3{font-size:25px;margin:8px 0}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#07879a;color:#fff;font-size:18px}
button.sec{background:#607d8b}button.danger{background:#b23b3b}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd7dc;border-radius:10px;font-size:16px;margin:5px 0 12px}
.equipo{border:2px solid #dce5e9;border-radius:17px;padding:18px;margin:14px 0}
.dato{font-size:17px;line-height:1.55}.qrbox{text-align:center;padding:15px;background:#f7fafb;border-radius:15px;margin-top:15px}
#qrcode{display:flex;justify-content:center;margin:15px 0}
.aviso{background:#fff5d8;border-left:5px solid #e2ad24;padding:12px;border-radius:8px}
small{color:#61717c}.cargando{text-align:center;padding:35px;font-size:18px}
</style>
</head>
<body>
<header class="encabezado">
<h1>❄️ R.C.C.</h1><p>Refrigeración y Climatización de Calidad</p>
</header>
<main id="app"><div class="cargando">Conectando con la base de datos…</div></main>

<script>
const SUPABASE_URL="https://joetztzelvqiyhauuyfqh.supabase.co";
const SUPABASE_KEY="sb_publishable_qnFHLnrGP-nNYJDNSdNAZA_pZrPZY9d";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BASE=location.origin+location.pathname;
const LOCAL_KEY="rcc_equipos_v1";
const MIGRATION_KEY="rcc_supabase_migrated_v1";
let datos=[];

async function cargar(){
  try{
    await migrarDatosLocales();
    const {data,error}=await sb.from("equipos").select("*").order("código");
    if(error) throw error;
    datos=(data||[]).map(normalizarEquipo);
    inicio();
  }catch(err){
    console.error(err);
    app.innerHTML=`<div class="tarjeta"><h2>⚠️ No se pudo conectar</h2><p>Revisa tu conexión a Internet y vuelve a intentarlo.</p><p><small>${esc(err.message||err)}</small></p><button onclick="cargar()">Reintentar</button></div>`;
  }
}

function normalizarEquipo(e){
  return {
    id:e.id,codigo:e.codigo,tipo:e.tipo||"",marca:e.marca||"",modelo:e.modelo||"",
    refrigerante:e.refrigerante||"",cliente:e.cliente||"",ubicacion:e.ubicacion||"",historial:[]
  };
}

async function migrarDatosLocales(){
  if(localStorage.getItem(MIGRATION_KEY)==="1") return;
  let locales=[];
  try{locales=JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]")}catch(e){locales=[]}
  if(!Array.isArray(locales)||!locales.length){localStorage.setItem(MIGRATION_KEY,"1");return}

  for(const e of locales){
    const registro={
      "código":String(e["código"]||e.codigo||e.code||"").trim(),
      cliente:e.cliente||e.client||"",
      tipo:e.tipo||e.type||"",
      marca:e.marca||e.brand||"",
      modelo:e.modelo||e.model||"",
      refrigerante:e.refrigerante||e.ref||"",
      ubicacion:e.ubicacion||"",
      estado:"Activo"
    };
    if(!registro.codigo) continue;

    const {data:equipo,error}=await sb.from("equipos").upsert(registro,{onConflict:"código"}).select().single();
    if(error) throw error;

    const historial=e.historial||e.history||[];
    if(Array.isArray(historial)&&historial.length){
      const filas=historial.map(h=>({
        equipo_id:equipo.id,
        fecha:h.fecha||h.date||null,
        trabajo:h.trabajo||h.work||h.kind||"",
        temperatura:h.temp||"",
        amperaje:h.amp||"",
        presion_baja:h.baja||h.low||"",
        presion_alta:h.alta||h.high||"",
        observaciones:h.observaciones||""
      }));
      const {error:he}=await sb.from("mantenimiento").insert(filas);
      if(he) throw he;
    }
  }
  localStorage.setItem(MIGRATION_KEY,"1");
}

async function inicio(){
  const p=new URLSearchParams(location.search);
  const codigo=p.get("equipo");
  if(codigo){
    const e=datos.find(x=>String(x.codigo).toLowerCase()===String(codigo).toLowerCase());
    if(e){await ficha(e.id);return;}
    app.innerHTML=`<div class="tarjeta"><h2>Equipo no encontrado</h2><p>No existe un equipo con el código <b>${esc(codigo)}</b>.</p><button onclick="lista()">Ver equipos</button></div>`;
    return;
  }
  lista();
}

function lista(){
 let h='<div class="tarjeta"><h2>Equipos</h2>';
 if(!datos.length) h+='<p>No hay equipos registrados todavía.</p>';
 datos.forEach(e=>{
   h+=`<div class="equipo">
    <h3>${esc(e.codigo)}</h3>
    <div class="dato">${esc(e.tipo)} · ${esc(e.marca)} ${esc(e.modelo)}</div>
    <div class="dato">${esc(e.cliente)}</div>
    <button onclick="ficha('${escJs(e.id)}')">📋 Ver ficha</button>
    <button onclick="verQR('${escJs(e.id)}')">📱 Ver QR de este equipo</button>
   </div>`;
 });
 h+=`<button onclick="agregar()">➕ Agregar equipo</button>
 <button class="sec" onclick="inicio()">↻ Inicio</button></div>`;
 app.innerHTML=h;
}

async function ficha(id){
 const e=datos.find(x=>String(x.id)===String(id));
 if(!e){lista();return}
 app.innerHTML='<div class="cargando">Cargando ficha…</div>';
 const {data:hist,error}=await sb.from("mantenimiento").select("*").eq("equipo_id",e.id).order("fecha",{ascending:false});
 if(error){alert("No se pudo cargar el historial: "+error.message);return}
 e.historial=hist||[];
 app.innerHTML=`<div class="tarjeta">
 <h2>${esc(e.codigo)}</h2>
 <div class="dato"><b>Tipo:</b> ${esc(e.tipo)}</div>
 <div class="dato"><b>Marca:</b> ${esc(e.marca)}</div>
 <div class="dato"><b>Modelo:</b> ${esc(e.modelo)}</div>
 <div class="dato"><b>Refrigerante:</b> ${esc(e.refrigerante)}</div>
 <div class="dato"><b>Cliente:</b> ${esc(e.cliente)}</div>
 <div class="dato"><b>Ubicación:</b> ${esc(e.ubicacion)}</div>
 <button onclick="verQR('${escJs(e.id)}')">📱 Ver QR de este equipo</button>
 <button onclick="mantencion('${escJs(e.id)}')">🔧 Registrar mantención</button>
 <h3>Historial</h3>
 ${e.historial.length?e.historial.map(x=>`<div class="equipo"><b>${esc(x.fecha||"")}</b><br>${esc(x.trabajo||"")}<br><small>Temp: ${esc(x.temperatura||"")} · Amp: ${esc(x.amperaje||"")} · Baja: ${esc(x.presion_baja||"")} PSI · Alta: ${esc(x.presion_alta||"")} PSI${x.observaciones?" · "+esc(x.observaciones):""}</small></div>`).join(""):"<p>Sin mantenciones registradas.</p>"}
 <button class="sec" onclick="lista()">← Volver a equipos</button>
 </div>`;
}

function verQR(id){
 const e=datos.find(x=>String(x.id)===String(id));
 if(!e)return;
 const url=BASE+"?equipo="+encodeURIComponent(e.codigo);
 app.innerHTML=`<div class="tarjeta">
 <h2>📱 QR del equipo</h2>
 <h3>${esc(e.codigo)}</h3>
 <p><b>Cliente:</b> ${esc(e.cliente)}</p>
 <p>Este QR es exclusivo para <b>${esc(e.codigo)}</b>.</p>
 <div class="qrbox"><div id="qrcode"></div><small>${esc(url)}</small></div>
 <button onclick="ficha('${escJs(e.id)}')">📋 Volver a ficha</button>
 <button class="sec" onclick="lista()">← Equipos</button>
 </div>`;
 new QRCode(document.getElementById("qrcode"),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
}

function agregar(){
 app.innerHTML=`<div class="tarjeta"><h2>➕ Agregar equipo</h2>
 <label>Código único</label><input id="codigo" placeholder="Ej: RCC004">
 <label>Tipo</label><input id="tipo" placeholder="Ej: Refrigerador">
 <label>Marca</label><input id="marca">
 <label>Modelo</label><input id="modelo">
 <label>Refrigerante</label><input id="refri">
 <label>Cliente</label><input id="cliente">
 <label>Ubicación</label><input id="ubicacion">
 <button onclick="crear()">Guardar equipo</button>
 <button class="sec" onclick="lista()">Cancelar</button></div>`;
}

async function crear(){
 const codigo=v("codigo");
 if(!codigo){alert("Debes ingresar un código único.");return;}
 if(datos.some(e=>String(e.codigo||e["código"]||"").toLowerCase()===codigo.toLowerCase())){alert("Ese código ya existe. Usa otro.");return;}
 const registro={"código":codigo,tipo:v("tipo"),marca:v("marca"),modelo:v("modelo"),refrigerante:v("refri"),cliente:v("cliente"),ubicacion:v("ubicacion"),estado:"Activo"};
 const {data,error}=await sb.from("equipos").insert(registro).select().single();
 if(error){alert("No se pudo guardar: "+error.message);return;}
 datos.push(normalizarEquipo(data));
 lista();
}

function mantencion(id){
 const e=datos.find(x=>String(x.id)===String(id));
 if(!e)return;
 app.innerHTML=`<div class="tarjeta"><h2>🔧 Mantención ${esc(e.codigo)}</h2>
 <label>Fecha</label><input type="date" id="fecha">
 <label>Trabajo realizado</label><textarea id="trabajo" placeholder="Describe el trabajo"></textarea>
 <label>Temperatura</label><input id="temp" placeholder="Ej: 2.8 °C">
 <label>Amperaje</label><input id="amp" placeholder="Ej: 7.98 A">
 <label>Presión baja</label><input id="baja" placeholder="PSI">
 <label>Presión alta</label><input id="alta" placeholder="PSI">
 <label>Observaciones</label><textarea id="observaciones"></textarea>
 <button onclick="guardarMant('${escJs(e.id)}')">Guardar mantención</button>
 <button class="sec" onclick="ficha('${escJs(e.id)}')">Cancelar</button></div>`;
 document.getElementById("fecha").value=new Date().toISOString().slice(0,10);
}

async function guardarMant(id){
 const fila={equipo_id:id,fecha:v("fecha")||null,trabajo:v("trabajo"),temperatura:v("temp"),amperaje:v("amp"),presion_baja:v("baja"),presion_alta:v("alta"),observaciones:v("observaciones")};
 const {error}=await sb.from("mantenimiento").insert(fila);
 if(error){alert("No se pudo guardar la mantención: "+error.message);return;}
 await ficha(id);
}

function v(id){return document.getElementById(id)?.value.trim()||""}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function escJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n").replace(/\r/g,"\\r");}

cargar();
</script>
</body>
</html>
