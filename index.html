<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R.C.C. Refrigeración y Climatización de Calidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef5f8;font-family:Arial,sans-serif;color:#17324d}
.encabezado{background:#07879a;color:#fff;text-align:center;padding:24px 16px}
.encabezado h1{margin:0;font-size:30px}.encabezado p{margin:6px 0 0;font-size:17px}
main{max-width:720px;margin:28px auto;padding:0 14px}
.tarjeta{background:#fff;border-radius:18px;padding:26px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
h2{margin-top:0;font-size:28px}h3{font-size:25px;margin:8px 0}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#07879a;color:#fff;font-size:18px}
button.sec{background:#607d8b}button.danger{background:#b23b3b}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd7dc;border-radius:10px;font-size:16px;margin:5px 0 12px}
.equipo{border:2px solid #dce5e9;border-radius:17px;padding:18px;margin:14px 0}
.dato{font-size:17px;line-height:1.55}.qrbox{text-align:center;padding:15px;background:#f7fafb;border-radius:15px;margin-top:15px}
#qrcode{display:flex;justify-content:center;margin:15px 0}
.aviso{background:#fff5d8;border-left:5px solid #e2ad24;padding:12px;border-radius:8px}
small{color:#61717c}
</style>
</head>
<body>
<header class="encabezado">
<h1>❄️ R.C.C.</h1><p>Refrigeración y Climatización de Calidad</p>
</header>
<main id="app"></main>

<script>
const KEY="rcc_equipos_v2";
const BASE=location.origin+location.pathname;
let datos=JSON.parse(localStorage.getItem(KEY)||"null");

function datosIniciales(){
  return [
    {codigo:"RCC-001",tipo:"Refrigerador",marca:"Ventus",modelo:"VRM-1300",refrigerante:"R404A",cliente:"Restaurante El Nuevo Arriero",ubicacion:"Cocina",historial:[]},
    {codigo:"RCC-002",tipo:"Vitrina",marca:"LG",modelo:"Djdh",refrigerante:"R134a",cliente:"Mariana",ubicacion:"",historial:[]}
  ];
}

function normalizarEquipo(e,indice){
  if(!e || typeof e!=="object") return null;
  const cliente=String(e.cliente||"").trim();
  const codigo=String(e.codigo||"").trim();
  if(!codigo && !cliente) return null;
  return {
    codigo: codigo || (cliente.toLowerCase().includes("mariana") ? "RCC-002" : "RCC-"+String(indice+1).padStart(3,"0")),
    tipo:String(e.tipo||"Equipo"),
    marca:String(e.marca||""),
    modelo:String(e.modelo||""),
    refrigerante:String(e.refrigerante||""),
    cliente:cliente || "Sin cliente",
    ubicacion:String(e.ubicacion||""),
    historial:Array.isArray(e.historial)?e.historial:[]
  };
}

function cargarDatos(){
  let guardados=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!Array.isArray(guardados)){
    guardados=JSON.parse(localStorage.getItem("rcc_equipos_v1")||"null");
  }
  let lista=Array.isArray(guardados)?guardados.map(normalizarEquipo).filter(Boolean):[];
  // Si el almacenamiento anterior quedó con fichas vacías, no dejamos tarjetas sin código.
  lista=lista.filter(e=>e.codigo);
  if(!lista.length) lista=datosIniciales();
  if(!lista.some(e=>e.codigo.toLowerCase()==="rcc-001")){
    lista.unshift(datosIniciales()[0]);
  }
  if(!lista.some(e=>e.cliente.toLowerCase()==="mariana")){
    lista.push(datosIniciales()[1]);
  }
  return lista;
}

function guardar(){localStorage.setItem(KEY,JSON.stringify(datos));}
datos=cargarDatos();
guardar();

function inicio(){
  const p=new URLSearchParams(location.search);
  const codigo=p.get("equipo");
  if(codigo){
    const i=datos.findIndex(x=>String(x.codigo).toLowerCase()===String(codigo).toLowerCase());
    if(i>=0){ficha(i);return;}
  }
  lista();
}

function lista(){
 let h='<div class="tarjeta"><h2>Equipos</h2>';
 datos.forEach((e,i)=>{
   h+=`<div class="equipo">
    <h3>${esc(e.codigo)}</h3>
    <div class="dato">${esc(e.tipo)} · ${esc(e.marca)} ${esc(e.modelo)}</div>
    <div class="dato">${esc(e.cliente)}</div>
    <button onclick="ficha(${i})">📋 Ver ficha</button>
    <button onclick="verQR(${i})">📱 Ver QR de este equipo</button>
   </div>`;
 });
 h+=`<button onclick="agregar()">➕ Agregar equipo</button>
 <button class="sec" onclick="inicio()">↻ Inicio</button></div>`;
 app.innerHTML=h;
}

function ficha(i){
 const e=datos[i];
 app.innerHTML=`<div class="tarjeta">
 <h2>${esc(e.codigo)}</h2>
 <div class="dato"><b>Tipo:</b> ${esc(e.tipo)}</div>
 <div class="dato"><b>Marca:</b> ${esc(e.marca)}</div>
 <div class="dato"><b>Modelo:</b> ${esc(e.modelo)}</div>
 <div class="dato"><b>Refrigerante:</b> ${esc(e.refrigerante)}</div>
 <div class="dato"><b>Cliente:</b> ${esc(e.cliente)}</div>
 <div class="dato"><b>Ubicación:</b> ${esc(e.ubicacion)}</div>
 <button onclick="verQR(${i})">📱 Ver QR de este equipo</button>
 <button onclick="mantencion(${i})">🔧 Registrar mantención</button>
 <h3>Historial</h3>
 ${e.historial.length?e.historial.map(x=>`<p>${esc(x.fecha)} — ${esc(x.trabajo)}<br><small>Temp: ${esc(x.temp)} · Amp: ${esc(x.amp)} · Baja: ${esc(x.baja)} PSI · Alta: ${esc(x.alta)} PSI</small></p>`).join(""):"<p>Sin mantenciones registradas.</p>"}
 <button class="sec" onclick="lista()">← Volver a equipos</button>
 </div>`;
}

function verQR(i){
 const e=datos[i];
 const url=BASE+"?equipo="+encodeURIComponent(e.codigo);
 app.innerHTML=`<div class="tarjeta">
 <h2>📱 QR del equipo</h2>
 <h3>${esc(e.codigo)}</h3>
 <p><b>Cliente:</b> ${esc(e.cliente)}</p>
 <p>Este QR es exclusivo para <b>${esc(e.codigo)}</b> y abre directamente su ficha.</p>
 <div class="qrbox"><div id="qrcode"></div><small>${esc(url)}</small></div>
 <button onclick="ficha(${i})">📋 Volver a ficha</button>
 <button class="sec" onclick="lista()">← Equipos</button>
 </div>`;
 new QRCode(document.getElementById("qrcode"),{
   text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M
 });
}

function escanearQR(){
  app.innerHTML=`<div class="tarjeta">
    <h2>📷 Escanear QR</h2>
    <p>Apunta la cámara al código QR del equipo.</p>
    <div id="lectorQR" style="width:100%;max-width:520px;margin:auto"></div>
    <div class="aviso">Cada QR debe abrir solamente la ficha del equipo al que pertenece.</div>
    <button class="sec" onclick="lista()">Cancelar</button>
  </div>`;
  if(typeof Html5Qrcode==="undefined"){
    alert("No se pudo cargar el lector QR. Revisa tu conexión a internet.");
    return;
  }
  const lector=new Html5Qrcode("lectorQR");
  window.__lectorQR=lector;
  lector.start(
    {facingMode:"environment"},
    {fps:10,qrbox:{width:250,height:250}},
    (texto)=>{
      lector.stop().catch(()=>{});
      window.__lectorQR=null;
      let codigo="";
      try{
        const u=new URL(texto);
        codigo=u.searchParams.get("equipo")||"";
      }catch(_){}
      if(!codigo) codigo=texto.trim();
      const i=datos.findIndex(e=>String(e.codigo).toLowerCase()===String(codigo).toLowerCase());
      if(i>=0){
        history.replaceState({}, "", BASE+"?equipo="+encodeURIComponent(datos[i].codigo));
        ficha(i);
      }else{
        app.innerHTML=`<div class="tarjeta"><h2>⚠️ Equipo no encontrado</h2>
          <p>El QR fue leído correctamente, pero no existe una ficha con el código:</p>
          <h3>${esc(codigo)}</h3>
          <button onclick="escanearQR()">📷 Intentar nuevamente</button>
          <button class="sec" onclick="lista()">← Equipos</button></div>`;
      }
    },
    ()=>{}
  ).catch(err=>{
    alert("No se pudo abrir la cámara. Debes permitir el acceso a la cámara.");
  });
}

function agregar(){
 app.innerHTML=`<div class="tarjeta"><h2>➕ Agregar equipo</h2>
 <label>Código único</label><input id="codigo" placeholder="Ej: RCC003">
 <label>Tipo</label><input id="tipo" placeholder="Ej: Refrigerador">
 <label>Marca</label><input id="marca">
 <label>Modelo</label><input id="modelo">
 <label>Refrigerante</label><input id="refri">
 <label>Cliente</label><input id="cliente">
 <label>Ubicación</label><input id="ubicacion">
 <button onclick="crear()">Guardar equipo</button>
 <button class="sec" onclick="lista()">Cancelar</button></div>`;
}

function crear(){
 const codigo=document.getElementById("codigo").value.trim();
 if(!codigo){alert("Debes ingresar un código único.");return;}
 if(datos.some(e=>e.codigo.toLowerCase()===codigo.toLowerCase())){alert("Ese código ya existe. Usa otro.");return;}
 datos.push({
  codigo,tipo:v("tipo"),marca:v("marca"),modelo:v("modelo"),refrigerante:v("refri"),
  cliente:v("cliente"),ubicacion:v("ubicacion"),historial:[]
 });
 guardar();lista();
}

function mantencion(i){
 const e=datos[i];
 app.innerHTML=`<div class="tarjeta"><h2>🔧 Mantención ${esc(e.codigo)}</h2>
 <label>Fecha</label><input type="date" id="fecha">
 <label>Trabajo realizado</label><textarea id="trabajo" placeholder="Describe el trabajo"></textarea>
 <label>Temperatura</label><input id="temp" placeholder="Ej: 2.8 °C">
 <label>Amperaje</label><input id="amp" placeholder="Ej: 7.98 A">
 <label>Presión baja</label><input id="baja" placeholder="PSI">
 <label>Presión alta</label><input id="alta" placeholder="PSI">
 <button onclick="guardarMant(${i})">Guardar mantención</button>
 <button class="sec" onclick="ficha(${i})">Cancelar</button></div>`;
 document.getElementById("fecha").value=new Date().toISOString().slice(0,10);
}

function guardarMant(i){
 datos[i].historial.push({
  fecha:v("fecha"),trabajo:v("trabajo"),temp:v("temp"),amp:v("amp"),baja:v("baja"),alta:v("alta")
 });
 guardar();ficha(i);
}

function v(id){return document.getElementById(id)?.value.trim()||""}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

inicio();
</script>
</body>
</html>
