<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R.C.C. Refrigeración y Climatización de Calidad</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef5f8;font-family:Arial,sans-serif;color:#17324d}.encabezado{background:#07879a;color:#fff;text-align:center;padding:24px 16px}.encabezado h1{margin:0;font-size:30px}.encabezado p{margin:6px 0 0;font-size:17px}main{max-width:720px;margin:28px auto;padding:0 14px}.tarjeta{background:#fff;border-radius:18px;padding:26px;margin-bottom:18px;box-shadow:0 3px 14px #0001}h2{margin-top:0;font-size:28px}h3{font-size:25px;margin:8px 0}button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#07879a;color:#fff;font-size:18px}button.sec{background:#607d8b}input,textarea{width:100%;padding:13px;border:1px solid #ccd7dc;border-radius:10px;font-size:16px;margin:5px 0 12px}.equipo{border:2px solid #dce5e9;border-radius:17px;padding:18px;margin:14px 0}.dato{font-size:17px;line-height:1.55}.qrbox{text-align:center;padding:15px;background:#f7fafb;border-radius:15px;margin-top:15px}#qrcode{display:flex;justify-content:center;margin:15px 0}.aviso{background:#fff5d8;border-left:5px solid #e2ad24;padding:12px;border-radius:8px}.cargando{text-align:center;padding:30px;font-size:18px}small{color:#61717c}</style></head><body><header class="encabezado"><h1>❄️ R.C.C.</h1><p>Refrigeración y Climatización de Calidad</p></header><main id="app"></main><script>
const SUPABASE_URL="https://joetztzelvqihauuyfqh.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_qnFHLnrGP-nNYJDNSdNAZA_pZrPZY9d";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const BASE=location.origin+location.pathname;let datos=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}function v(id){return document.getElementById(id)?.value.trim()||""}function em(e){return e?.message||e?.details||e?.hint||"Error desconocido"}
async function cargar(){app.innerHTML='<div class="tarjeta cargando">⏳ Cargando equipos...</div>';const{data,error}=await sb.from("equipos").select("*").order("identificación",{ascending:true});if(error){app.innerHTML=`<div class="tarjeta"><h2>⚠️ No se pudieron cargar los equipos</h2><div class="aviso">${esc(em(error))}</div><p>Revisa las políticas de acceso de Supabase para <b>equipos</b>.</p></div>`;return false}datos=data||[];return true}
async function inicio(){if(!await cargar())return;const c=new URLSearchParams(location.search).get("equipo");if(c){const i=datos.findIndex(x=>String(x["código"]||"").toLowerCase()===c.toLowerCase());if(i>=0){ficha(i);return}app.innerHTML=`<div class="tarjeta"><h2>Equipo no encontrado</h2><p>No existe el equipo <b>${esc(c)}</b>.</p><button class="sec" onclick="lista()">← Ver equipos</button></div>`;return}lista()}
function lista(){let h='<div class="tarjeta"><h2>Equipos</h2>';if(!datos.length)h+='<p>No hay equipos registrados todavía.</p>';datos.forEach((e,i)=>h+=`<div class="equipo"><h3>${esc(e["código"])}</h3><div class="dato">${esc(e.tipo)} · ${esc(e.marca)} ${esc(e.modelo)}</div><div class="dato">${esc(e.cliente)}</div><button onclick="ficha(${i})">📋 Ver ficha</button><button onclick="verQR(${i})">📱 Ver QR de este equipo</button></div>`);h+='<button onclick="agregar()">➕ Agregar equipo</button><button class="sec" onclick="inicio()">↻ Actualizar</button></div>';app.innerHTML=h}
async function ficha(i){const e=datos[i];const{data:hist,error}=await sb.from("mantenimientos").select("*").eq("equipo_id",e["identificación"]).order("fecha",{ascending:false});if(error){app.innerHTML=`<div class="tarjeta"><h2>${esc(e["código"])}</h2><div class="aviso">No se pudo cargar el historial: ${esc(em(error))}</div><button class="sec" onclick="lista()">← Volver</button></div>`;return}app.innerHTML=`<div class="tarjeta"><h2>${esc(e["código"])}</h2><div class="dato"><b>Tipo:</b> ${esc(e.tipo)}</div><div class="dato"><b>Marca:</b> ${esc(e.marca)}</div><div class="dato"><b>Modelo:</b> ${esc(e.modelo)}</div><div class="dato"><b>Refrigerante:</b> ${esc(e.refrigerante)}</div><div class="dato"><b>Cliente:</b> ${esc(e.cliente)}</div><div class="dato"><b>Ubicación:</b> ${esc(e.ubicacion)}</div><button onclick="verQR(${i})">📱 Ver QR de este equipo</button><button onclick="mantencion(${i})">🔧 Registrar mantención</button><h3>Historial</h3>${hist?.length?hist.map(x=>`<p>${esc(x.fecha)} — ${esc(x.trabajo)}<br><small>Temp: ${esc(x.temperatura)} · Amp: ${esc(x.amperaje)} · Baja: ${esc(x.baja)} PSI · Alta: ${esc(x.alta)} PSI</small></p>`).join(""):"<p>Sin mantenciones registradas.</p>"}<button class="sec" onclick="lista()">← Volver a equipos</button></div>`}
function verQR(i){const e=datos[i],url=BASE+"?equipo="+encodeURIComponent(e["código"]);app.innerHTML=`<div class="tarjeta"><h2>📱 QR del equipo</h2><h3>${esc(e["código"])}</h3><p><b>Cliente:</b> ${esc(e.cliente)}</p><p>Este QR es exclusivo para <b>${esc(e["código"])}</b>.</p><div class="qrbox"><div id="qrcode"></div><small>${esc(url)}</small></div><button onclick="ficha(${i})">📋 Volver a ficha</button><button class="sec" onclick="lista()">← Equipos</button></div>`;new QRCode(document.getElementById("qrcode"),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}
function agregar(){app.innerHTML=`<div class="tarjeta"><h2>➕ Agregar equipo</h2><label>Código único</label><input id="codigo" placeholder="Ej: RCC004"><label>Tipo</label><input id="tipo" placeholder="Ej: Refrigerador"><label>Marca</label><input id="marca"><label>Modelo</label><input id="modelo"><label>Refrigerante</label><input id="refri"><label>Cliente</label><input id="cliente"><label>Ubicación</label><input id="ubicacion"><button onclick="crear()">Guardar equipo</button><button class="sec" onclick="lista()">Cancelar</button></div>`}
async function crear(){const codigo=v("codigo");if(!codigo){alert("Debes ingresar un código único.");return}const{data:ex,error:ce}=await sb.from("equipos").select("identificación").eq("código",codigo).limit(1);if(ce){alert("No se pudo comprobar el código: "+em(ce));return}if(ex?.length){alert("Ese código ya existe. Usa otro.");return}const{error}=await sb.from("equipos").insert({"código":codigo,tipo:v("tipo"),marca:v("marca"),modelo:v("modelo"),refrigerante:v("refri"),cliente:v("cliente"),ubicacion:v("ubicacion")});if(error){alert("No se pudo guardar el equipo: "+em(error));return}inicio()}
function mantencion(i){const e=datos[i];app.innerHTML=`<div class="tarjeta"><h2>🔧 Mantención ${esc(e["código"])}</h2><label>Fecha</label><input type="date" id="fecha"><label>Trabajo realizado</label><textarea id="trabajo" placeholder="Describe el trabajo"></textarea><label>Temperatura</label><input id="temp" placeholder="Ej: 2.8 °C"><label>Amperaje</label><input id="amp" placeholder="Ej: 7.98 A"><label>Presión baja</label><input id="baja" placeholder="PSI"><label>Presión alta</label><input id="alta" placeholder="PSI"><button onclick="guardarMant(${i})">Guardar mantención</button><button class="sec" onclick="ficha(${i})">Cancelar</button></div>`;document.getElementById("fecha").value=new Date().toISOString().slice(0,10)}
async function guardarMant(i){const e=datos[i],registro={equipo_id:e["identificación"],fecha:v("fecha"),trabajo:v("trabajo"),temperatura:v("temp"),amperaje:v("amp"),baja:v("baja"),alta:v("alta")};const{error}=await sb.from("mantenimientos").insert(registro);if(error){alert("No se pudo guardar la mantención: "+em(error));return}await cargar();const n=datos.findIndex(x=>String(x["código"])===String(e["código"]));if(n>=0)ficha(n)}
inicio();</script></body></html>
